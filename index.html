<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>ХП — безопасная передача</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="send.js"></script>
</head>
<body>
<main>
  <header><span class="logo">ХП</span> Безопасная передача</header>
  <p id="status" class="status">Загрузка…</p>
  <form id="password-form" hidden>
    <input id="password" type="password" autocomplete="off" placeholder="Пароль к ссылке" aria-label="Пароль к ссылке">
    <button type="submit">Открыть</button>
  </form>
  <section id="content"></section>
  <footer>Данные расшифрованы в этом браузере. Ключ находится в самой ссылке и не отправляется на сервер.
    Закройте страницу, когда закончите.</footer>
</main>
</body>
</html>
